# Simulation package manifest (soft-sector-data-curation, format 1).
# Read by run_pipeline.py --sim-package <this directory>; see README.md.
format_version: 1
name: zr96c2
title: "A=96 isobar campaign 2: 200 GeV, iEBE-MUSIC 2D, full T^munu, three delta f models"
container: 2d

# Merged results, relative to this directory (run_pipeline --data-root
# overrides it when the data live elsewhere).
data_root: ../merged

adapter:
  module: sim_adapters.iebe_music
  repo: soft-sector-sim-adapters
  options:
    xsec_table: cross_sections_a96.csv

# One A=96 nucleus per design point: the sampler has no proton number, so the
# same events stand for Ru+Ru and Zr+Zr at the design point's nuclear shape.
systems:
  - {reaction: Ru Ru, energy_gev: 200}
  - {reaction: Zr Zr, energy_gev: 200}

# delta f models; every hydro surface is particlized once per model.
variants: [Grad22, CE, PTB]

design:
  file: design_lhs2000_A96_c2.csv
  id_column: label

# Default record selection (run_pipeline.py options) for run_campaign.py.
selection:
  type: [flow_vn, particle_yields, particle_spectra]
  reaction: '^(Ru\+Ru|Zr\+Zr)$'
  energy: 200

provenance:
  simulation_code: "github.com/mluzum/iEBE-MUSIC, branch NME (= campaign2), image pin 17ae5b4"
  container_image: "iebe-music_slim_17ae5b4_f5242628.sif (md5 f52426284ebb281b813f21d931bd847a)"
  design: "design_0001-2000: GeSe design/design_lhs2000_A96_c2.csv at 1306841 (normalization 6-13); design_2001-2360: extension of 2026-11-02 (180 pairs, see README)"
  cross_sections: "dp 1-1000: TRENTo inelastic cross section per design point (GeSe scripts/cross_section) on the campaign-1 dictionaries, valid here: same b_max, sigma_NN and nuclei; dp 2001-2360: the same procedure on the extension dictionaries (GeSe 321fa6c)"
